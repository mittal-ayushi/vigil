<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VIGIL</title>
</head>

<body>
  <h1> VIGIL </h1>
  <h2>Upload a Script</h2>
  <input type="file" id="upload">
  <p>Or download a script from below to test</p>
  <button id="submit">Scan Script</button>

  <p id="uploadStatus"></p>

  <h2>Status</h2>
  <p id="status">Choose a file and click Scan</p>

  <p>Total alerts: <span id="alert">0</span></p>
  <p>Total bursts: <span id="burst">0</span></p>

  <h2>Live Feed</h2>
  <table id="feedTable">
      <thead>
    <tr>
      <th>time</th>
      <th>type</th>
      <th>rule</th>
      <th>detail</th>
    </tr>
  </thead>
  <tbody id="feedBody"></tbody>

  </table>

</body>
</html>
